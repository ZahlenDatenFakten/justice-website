<head>
    <meta charset="UTF-8">

    <meta name="description" content="Официальная система документооборота Офиса Генерального Прокурора штата Сан-Андреас.">
    <title>DOJ | San Andreas Department of Justice</title>
    <!-- Favicon setup - now uses favicon.png -->
    <link rel="icon" type="image/png" href="/img/favicon.png">
    
    <!-- We keep Tailwind CDN for simplicity in this setup, though proper build usually imports it in CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Times+New+Roman:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class', // Enable manual dark mode toggling
        theme: {
          extend: {
            fontFamily: {
              serif: ['"Times New Roman"', 'serif'],
              sans: ['Inter', 'sans-serif'],
            },
            colors: {
              'gov-blue': '#1e293b',
              'gov-dark': '#0f172a',
            }
          }
        }
      }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #f1f5f9;
        }
        /* Custom print styles */
        @media print {
            body * {
                visibility: hidden;
            }
            .print-area, .print-area * {
                visibility: visible;
            }
            .print-area {
                position: absolute;
                left: 0;
                top: 0;
                margin: 0;
                padding: 0;
                width: 100% !important;
                height: 100% !important;
                box-shadow: none !important;
                border: none !important;
                background-color: white !important;
            }
            @page {
                size: A4;
                margin: 0;
            }
            
            /* FORCE GRAPHICS AND LINKS */
            * {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
            
            a {
                color: #2563eb !important; /* Tailwind blue-600 */
                text-decoration: underline !important;
                pointer-events: auto !important;
                cursor: pointer !important;
            }
        }
    </style>
